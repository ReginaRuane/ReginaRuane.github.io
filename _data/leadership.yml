roles:
  - org: "Computational Social Science Lab &amp; Center for AI and Society"
    institution: "University of Pennsylvania"
    title: "Managing Director"
    years: "2022 –"
    current: true
    blurb: >
      A joint initiative of the School of Engineering and Applied Science, the Wharton
      School, and the Annenberg School for Communication. Direct research and
      administrative operations, budgets, staffing, and strategic development; serve on
      the leadership team of the Center for AI and Society, building interdisciplinary
      collaborations across analytics, artificial intelligence, and their social
      consequences.
    points:
      - "Co-led the establishment of the Penn Center on Media, Technology, and Democracy, spanning six schools."
      - "Convened AI for Disaster Relief with Meta AI for Good and Crisis Ready, connecting agencies, nonprofits, industry, and researchers."
      - "Built the cross-school relationships — six deans, the President's office, finance, communications, development — that a grant of that size requires."

  - org: "International Society for Computational Social Science"
    institution: "ISCSS / IC2S2"
    title: "Executive Director"
    years: "2022 –"
    current: true
    blurb: >
      Oversee operations and organizational structure for the Society and for IC2S2, the
      field's flagship international conference. Coordinate with international
      collaborators, academic institutions, and industry partners, and advise the board on
      governance and strategic direction.

  - org: "Data Science Institute"
    institution: "Temple University"
    title: "Executive Director"
    years: "2020 – 2022"
    blurb: >
      Led a university-wide institute: advisory board and governance, partnerships,
      budgets, faculty and research engagement, grants, and outreach. Concurrently
      Assistant Professor of Research in Statistical Science and Managing Director of
      Pedagogical Research.
    points:
      - "Built partnerships with Disney, Wells Fargo, Google, BlackRock, Millennium Management, LongTail Alpha, Blockchain.com, the Keystone Space Collaborative, and the City of Philadelphia."
      - "Developed and oversaw NSF, NIH, Office of Naval Research, DARPA, and NASA grant projects."
      - "Founded a Women in Data Science Collective at Temple."

  - org: "Harvard University &amp; Temple University"
    institution: ""
    title: "Postdoctoral Research Fellow"
    years: "2018 – 2020"
    blurb: >
      Statistical training under Edoardo M. Airoldi and Paul A. Pavlou: design and
      analysis of digital experiments, sampling and inference with network data, and
      causal analysis in complex observational studies with time, space, or network
      structure.

  - org: "Exploratory Studies Program"
    institution: "Drexel University"
    title: "Founding Program Director"
    years: "2014 – 2017"
    blurb: >
      Built a program from founding stage to completion: 300% enrollment growth and $10M
      in revenue within three years, a peer mentoring system, an advising model aligned to
      assessed learning outcomes, and a team of ten.

