preprints:
  - title: "Replicable Conformal Prediction"
    authors: "Marios Papamichalis, Regina Ruane, Theofanis Papamichalis"
    year: 2026
    venue: "Preprint"
    arxiv: "2608.23638"
    topics: [ml, bayesian]
    abstract: >
      Algorithms for generating consistent uncertainty sets across independent data
      samples, joining the replicability literature to distribution-free conformal
      prediction.

  - title: "Minimax Synthesis of Network Mechanisms"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2026
    venue: "Preprint"
    arxiv: "2606.15836"
    topics: [networks, bayesian]
    abstract: >
      A single observed network reflects several mechanisms at once: communities, hubs,
      and clustering coexist in one graph, each a different model. We treat the network as
      a combination of candidate mechanisms and study, from a single graph, how strongly
      each mechanism contributes and how they combine. Fitting the mechanisms and their
      strengths from the same data biases the strengths toward zero; a correction removes
      this bias and yields valid confidence intervals. When a graph is generated by two
      mechanisms acting together, the graph alone determines whether they combine
      additively or interact, exactly when the graph is dense enough — a sharp threshold
      below which no test can decide. We establish matching minimax rates and apply the
      methods to real networks, where in one case a confidence interval excludes any
      positive contribution from a candidate mechanism.

  - title: "Collapsed Structured Block Models for Community Detection in Complex Networks"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2026
    venue: "Preprint"
    arxiv: "2601.02828"
    topics: [networks, bayesian]
    abstract: >
      Community detection seeks to recover mesoscopic structure from network data that may
      be binary, count-valued, signed, directed, weighted, or multilayer. In Bayesian
      stochastic block models, standard MCMC alternates between updating the partition and
      sampling block parameters, which can hinder mixing and complicate comparison across
      partitions and numbers of communities. We develop a collapsed Bayesian SBM framework
      in which block-specific nuisance parameters are analytically integrated out under
      conjugate priors, so the marginal likelihood depends only on the partition and
      blockwise sufficient statistics. This yields fast local Gibbs/Metropolis updates and
      evidence-based complexity control that discourages gratuitous over-partitioning. We
      derive exact collapsed marginals for Beta-Bernoulli, Gamma-Poisson, and
      Normal-Inverse-Gamma edge types, and extend the strategy to directed, signed, and
      multiplex block models.

  - title: "Decomposing Degree Assortativity in Sparse Spatial Networks"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2025
    venue: "Preprint"
    note: "Formerly circulated as “CoLaS: Copula-Seeded Sparse Local Graphs”"
    arxiv: "2512.20019"
    code: "https://github.com/MariosPapamix/Decomposing-Degree-Assortativity-in-Sparse-Spatial-Networks"
    topics: [networks]
    abstract: >
      Empirical networks are typically sparse yet display pronounced degree variation,
      persistent transitivity, and systematic degree mixing. Most sparse generators
      control at most two of these features, and assortativity is often achieved by
      degree-preserving rewiring, which obscures the mechanism–parameter link. We
      introduce CoLaS, a modular latent-variable model that separates marginal
      specifications from dependence: each node has a popularity variable governing degree
      heterogeneity and a latent geometric location governing locality, and a
      low-dimensional copula couples the two. We develop sparse-limit theory for degrees,
      transitivity, and assortativity, and establish a degree-tail dichotomy — with
      fixed-range local kernels, degree tails are necessarily light, even under
      heavy-tailed popularity.

  - title: "Multiscale Localized Inference for Networks with a Measured Vertex Coordinate"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2025
    venue: "Preprint"
    note: "Formerly circulated as “Wavelet Latent Position Exponential Random Graphs”"
    arxiv: "2512.18592"
    topics: [networks, bayesian]
    abstract: >
      Many network datasets exhibit connectivity that varies by resolution, with
      large-scale organization coexisting with localized departures. When vertices have an
      observed ordering or embedding — genome position in Hi-C contact maps, geography in
      spatial and village networks, anatomical coordinates in connectomes — learning where
      and at what resolution connectivity departs from a baseline is crucial. We introduce
      wavelet latent position exponential random graphs, an exchangeable logistic-graphon
      framework in which the log-odds connectivity kernel is represented in compactly
      supported orthonormal wavelet coordinates. Wavelet coefficients are indexed by
      resolution and location, which allows multiscale structure to become sparse and
      directly interpretable, and enables likelihood-based regularization and testing in
      coefficient space.

  - title: "State-Space Modeling of Time-Varying Spillovers on Networks"
    authors: "Marios Papamichalis, Regina Ruane, Theofanis Papamichalis"
    year: 2025
    venue: "Preprint"
    arxiv: "2512.18584"
    topics: [networks, fintech, bayesian]
    abstract: >
      Many modern time series arise on networks, where each component is attached to a
      node and interactions follow observed edges. Classical time-varying parameter VARs
      treat all series symmetrically and ignore this structure, while network
      autoregressive models exploit a given graph but usually impose constant parameters
      and stationarity. We develop network state-space models in which a low-dimensional
      latent state controls time-varying network spillovers, own-lag persistence, and
      nodal covariate effects. Conceptually, network state-space models separate where
      interactions may occur (the graph) from how strong they are at each time (the latent
      state), providing an interpretable alternative to both unstructured TVP-VARs and
      existing network time-series models.

  - title: "Radial Compensation: The Inverse Base-Distribution Problem for Chart-Based Generative Models on Riemannian Manifolds"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2025
    venue: "Preprint"
    arxiv: "2511.14056"
    topics: [ml, bayesian]
    abstract: >
      We study the base distribution in chart-based generative models on Riemannian
      manifolds. Standard methods sample in Euclidean tangent space and then map the
      sample to the manifold with a chart, but this changes the meaning of distance: the
      same tangent-space scale can correspond to different geodesic radii under different
      charts, curvatures, and dimensions. Within isotropic, scalar-Jacobian azimuthal
      charts, we show that no base distribution can simultaneously preserve
      geodesic-radial likelihoods, chart-invariant radial Fisher information, and
      tangent-space isotropy unless it has a specific form, which we call Radial
      Compensation. This decouples the statistical meaning of the model from its numerical
      conditioning: chart choice becomes a numerical preconditioner rather than a hidden
      modeling decision.

