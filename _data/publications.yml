review:
  - title: "Legal Infrastructure Organizes Eviction: Evidence from Philadelphia"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2026
    venue: "Under review"
    status: "Under review"
    arxiv: "2604.21212"
    topics: [eviction, networks, causal]
    featured: true
    abstract: >
      We analyze the filing-side legal infrastructure of eviction using 755,004
      Philadelphia Municipal Court landlord–tenant records filed between 1969 and 2022,
      of which 747,125 are residential. Eviction in Philadelphia is organized upstream by
      a concentrated plaintiff-side bar, durable plaintiff–attorney dependence, repeated
      use of the same properties, and recurring tenant-name exposure. Between 1983 and
      2022, the ten most active plaintiff attorneys handled 82.2% of represented
      plaintiff-side cases per year on average, compared with 14.8% for the ten most
      active plaintiffs. Across the residential filing universe, 48.8% of cases occur at
      addresses with a prior filing in the preceding year, and 23.6% at addresses with
      six or more prior filings. We interpret eviction as a layered upstream process in
      which concentrated counsel, repeated places, and recurring tenants produce filings
      before any courtroom bargaining or adjudication occurs.

  - title: "How Eviction Court Governs: A Statistical Analysis of Bargaining, Templates, and Debt in Philadelphia"
    authors: "Marios Papamichalis, Regina Ruane"
    year: 2026
    venue: "Under review"
    status: "Under review"
    arxiv: "2605.24849"
    topics: [eviction, networks, causal]
    featured: true
    abstract: >
      We analyze downstream courtroom governance in Philadelphia eviction cases using
      755,004 Municipal Court landlord–tenant records filed from 1969 through 2022.
      Post-filing case processing is organized by repeated courtroom relationships, judge
      and tenant-attorney regimes, reusable agreement templates, and repeated
      team–property units. Among both-represented cases, 58.2% involve a plaintiff-side
      and tenant-side attorney pair that had appeared against one another in the prior
      year, and greater prior pair exposure predicts lower default, higher judgment-by-
      agreement, and higher served-writ rates. Settlement text is highly standardized:
      reusable templates explain strictness, waiver, lockout-trigger, payment-plan, and
      deadline language far more strongly than raw attorney identity. Eviction court
      emerges as a repeated institutional field that organizes bargaining, text, debt,
      and enforcement after cases enter the courtroom pipeline.

  - title: "Bayesian Predictive Synthesis for Dynamic Networks: Forecasting and Identifying Structural Mechanisms"
    authors: "Marios Papamichalis, Regina Ruane, Theofanis Papamichalis"
    year: 2026
    venue: "Journal of the American Statistical Association"
    status: "Under revision, 2nd R&R"
    arxiv: "2606.26136"
    topics: [networks, bayesian]
    featured: true
    abstract: >
      Networks are shaped by competing structural mechanisms, such as communities,
      geometry, or hubs. In a dynamic network the most predictive mechanism can change,
      and a model tied to one mechanism, or to fixed weights, cannot adapt as the dominant
      structure shifts. We develop dynamic Bayesian predictive synthesis for networks, in
      which a mechanism is an agent forecasting the next snapshot's edges and a synthesis
      layer combines them with time-varying weights. At each step the method returns a
      calibrated edge forecast and inference on the mechanism weights, with intervals
      valid given the fitted agents, so it also reports which mechanism is most
      informative. A sharp threshold separates distinguishable from indistinguishable
      mechanisms, and a change in the active mechanism is tracked at an optimal
      per-switch cost.

  - title: "Decision-Theoretic Robustness for Network Models"
    authors: "Marios Papamichalis, Regina Ruane, Simón Lunagómez, Swati Chandna"
    year: 2026
    venue: "Journal of Machine Learning Research"
    status: "Under revision"
    arxiv: "2601.02811"
    topics: [networks, bayesian]
    featured: true
    abstract: >
      Network data from neuroscience, epidemiology, and the social sciences are routinely
      analyzed with Bayesian network models such as Erdős–Rényi graphs, stochastic block
      models, random dot product graphs, and graphon priors. In such applications these
      models are only approximations, whereas real networks are sparse, heterogeneous,
      and exhibit higher-order dependencies. This raises the question: how stable are
      network-based decisions, model selection, functional summaries, and policy
      recommendations under small misspecification of the assumed model? We address this
      using a local decision-theoretic robustness framework, in which the posterior is
      allowed to vary within a small Kullback–Leibler neighborhood and actions are chosen
      to minimize the worst-case posterior expected loss. We derive sharp small-radius
      expansions for the robust posterior risk, obtain a universal critical exponent
      describing how decision-level uncertainty explodes near criticality, develop a
      nonparametric minimax theory for robust model selection, and illustrate a practical
      algorithm on functional brain connectivity and Karnataka village social networks.

