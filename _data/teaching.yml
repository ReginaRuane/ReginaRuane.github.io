# Courses she is prepared to build or teach
proposed:
  - title: "Applied Networks"
    blurb: "A second course for data-analytics students: descriptive network statistics, block models and latent space models, and what can and cannot be inferred from one observed graph."
  - title: "Statistical Consulting Practicum"
    blurb: "Live problems from local government, courts, and nonprofits. Students scope the question, negotiate the data, and deliver a report a non-statistician can act on."
  - title: "Stochastic Volatility and Financial Time Series"
    blurb: "Developed from a study of cryptocurrency trading: state-space models, particle filtering, and the Bates model, aimed at financial and actuarial mathematics students."
  - title: "Introductory Statistics"
    blurb: "The introductory sequence, taught from real questions about students' own neighborhoods, careers, and interests, with data they can obtain themselves."
